version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: mandivision-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: mandivision
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mandivision-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mandivision-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/mandivision?schema=public
      JWT_SECRET: mandivision-change-this-in-production
      JWT_EXPIRES_IN: 7d
      PYTHON_API_URL: http://host.docker.internal:8000
    depends_on:
      - postgres
    networks:
      - mandivision-network

volumes:
  postgres_data:

networks:
  mandivision-network:
    driver: bridge
